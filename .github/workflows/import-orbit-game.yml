name: Import ORBIT BREAK into Gamezcoin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-orbit-game.yml'

permissions:
  contents: write

jobs:
  import-orbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy exact ORBIT BREAK web source
        run: |
          set -euo pipefail
          mkdir -p public/orbit-break/assets
          curl -fsSL https://raw.githubusercontent.com/billboy1102/ORBIT-BREAK/main/index.html -o public/orbit-break/index.html
          curl -fsSL https://raw.githubusercontent.com/billboy1102/ORBIT-BREAK/main/game-base.html -o public/orbit-break/game-base.html
          curl -fsSL https://raw.githubusercontent.com/billboy1102/ORBIT-BREAK/main/assets/bobbey-game-studio-splash.jpg -o public/orbit-break/assets/bobbey-game-studio-splash.jpg

      - name: Add Gamezcoin score and reward bridge only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public/orbit-break/index.html')
          s = p.read_text(encoding='utf-8')

          marker = "let orbitSettings={vibration:true,language:'vi',volume:1};"
          injected = marker + "\nconst GAMEZCOIN_QUERY=new URLSearchParams(window.parent.location.search),GAMEZCOIN_MODE=GAMEZCOIN_QUERY.get('gamezcoin')==='1',GAMEZCOIN_TOKEN=GAMEZCOIN_QUERY.get('token')||'';let gamezcoinRunId=0;"
          if marker not in s:
              raise SystemExit('ORBIT settings marker not found')
          s = s.replace(marker, injected, 1)

          old_reset = "reset=function(){\n  score=0;combo=1;bestCombo=1;hits=0;"
          new_reset = "reset=function(){\n  if(GAMEZCOIN_MODE){gamezcoinRunId++;window.top.postMessage({prefix:'gamezcoin-orbit',type:'session-request',token:GAMEZCOIN_TOKEN,run_id:gamezcoinRunId},'*')}\n  score=0;combo=1;bestCombo=1;hits=0;"
          if old_reset not in s:
              raise SystemExit('ORBIT reset marker not found')
          s = s.replace(old_reset, new_reset, 1)

          old_score = "score+=1;combo=1;"
          new_score = "score+=GAMEZCOIN_MODE?10:1;combo=1;"
          if old_score not in s:
              raise SystemExit('ORBIT score marker not found')
          s = s.replace(old_score, new_score, 1)

          old_finish = "setTimeout(function(){state='over';high=Math.max(high,score);"
          new_finish = "setTimeout(function(){if(GAMEZCOIN_MODE)window.top.postMessage({prefix:'gamezcoin-orbit',type:'finish',token:GAMEZCOIN_TOKEN,run_id:gamezcoinRunId,score:score,hits:hits},'*');state='over';high=Math.max(high,score);"
          if old_finish not in s:
              raise SystemExit('ORBIT finish marker not found')
          s = s.replace(old_finish, new_finish, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add ORBIT BREAK card to Gamezcoin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/app-v2.js')
          s = p.read_text(encoding='utf-8')

          api_import = "import { supabase, api, adminApi } from './api.js'"
          orbit_import = "import { startOrbitBreak } from './orbit-game.js'"
          if orbit_import not in s:
              if api_import not in s:
                  raise SystemExit('Gamezcoin import marker not found')
              s = s.replace(api_import, api_import + "\n" + orbit_import, 1)

          start = s.find('function renderGames() {')
          end = s.find('\nfunction renderCheckin()', start)
          if start < 0 or end < 0:
              raise SystemExit('renderGames block not found')

          render_games = r'''function renderGames() {
  const view = root.querySelector('#view')
  const games = state.data.games || []
  const block = games.find((item) => item.id === 'block-blast')
  const orbit = games.find((item) => item.id === 'orbit-break')
  view.innerHTML = `
    <section class="hero">
      <div>
        <i>KHÔNG GIỚI HẠN COIN/NGÀY</i>
        <h2>Chơi càng tốt, nhận càng nhiều</h2>
        <p>Điểm được server xác minh trước khi cộng coin.</p>
      </div>
      <div class="coin big">G</div>
    </section>
    <h3>Mini game</h3>
    <div class="games">
      ${block ? `
        <article class="card game block-card">
          <div class="gi">🧩</div>
          <div>
            <strong>${e(block.name || 'Block Blast')}</strong>
            <small>${e(block.description || 'Kéo các khối vào bảng 8×8, xóa hàng và cột để ghi điểm.')}</small>
            <em>10 điểm = 1 coin</em>
          </div>
          <button id="play-block">Chơi</button>
        </article>` : ''}
      ${orbit ? `
        <article class="card game orbit-card">
          <div class="gi">◉</div>
          <div>
            <strong>${e(orbit.name || 'ORBIT BREAK')}</strong>
            <small>${e(orbit.description || 'Bấm đúng nhịp để chuyển quỹ đạo.')}</small>
            <em>+10 điểm/lần đúng · 100 điểm = 10 coin</em>
            <span class="block-badge">ORBIT BREAK</span>
          </div>
          <button id="play-orbit">Chơi</button>
        </article>` : ''}
      ${!block && !orbit ? '<section class="card"><p>Chưa có mini game đang bật.</p></section>' : ''}
    </div>`

  const blockButton = view.querySelector('#play-block')
  if (blockButton) blockButton.onclick = () => startBlockBlast()
  const orbitButton = view.querySelector('#play-orbit')
  if (orbitButton) orbitButton.onclick = () => startOrbitBreak({
    root,
    api,
    refresh: () => load('bootstrap', false),
    toast,
    onExit: () => renderApp()
  })
}
'''
          s = s[:start] + render_games + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit imported game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/orbit-break src/app-v2.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: embed exact ORBIT BREAK reward mini game"
          git push
