name: Deploy Gamezcoin Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gamezcoin-pages
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Materialize landing artwork
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const source = fs.readFileSync('public/assets/gamezcoin-rewards-user.svg', 'utf8');
          const marker = 'data:image/webp;base64,';
          const start = source.indexOf(marker);
          if (start < 0) throw new Error('Embedded WebP marker not found');
          const from = start + marker.length;
          const end = source.indexOf('"', from);
          if (end < 0) throw new Error('Embedded WebP payload end not found');
          const payload = source.slice(from, end).replace(/\s+/g, '');
          const bytes = Buffer.from(payload, 'base64');
          if (bytes.length < 16 || bytes.toString('ascii',0,4) !== 'RIFF' || bytes.toString('ascii',8,12) !== 'WEBP') throw new Error('Decoded artwork is not WebP');
          fs.mkdirSync('public/assets', {recursive:true});
          fs.writeFileSync('public/assets/gamezcoin-rewards-artwork.webp', bytes);
          console.log(`Artwork ready: ${bytes.length} bytes`);
          NODE
      - name: Build web
        run: npm run build
      - name: Verify artwork in dist
        run: |
          test -s dist/assets/gamezcoin-rewards-artwork.webp
          node -e "const b=require('fs').readFileSync('dist/assets/gamezcoin-rewards-artwork.webp'); if(b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP') process.exit(1); console.log('dist artwork OK:',b.length,'bytes')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
