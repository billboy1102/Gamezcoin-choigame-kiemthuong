name: Deploy Gamezcoin Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gamezcoin-pages
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web
        run: npm run build
      - name: Create landing artwork WebP
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('public/assets/gamezcoin-rewards-user.svg', 'utf8');
          const match = source.match(/data:image\/webp;base64,([^"']+)/);
          if (!match) throw new Error('Embedded Gamezcoin WebP not found');
          const bytes = Buffer.from(match[1].replace(/\s+/g, ''), 'base64');
          if (bytes.subarray(0, 4).toString('ascii') !== 'RIFF' || bytes.subarray(8, 12).toString('ascii') !== 'WEBP') throw new Error('Invalid WebP payload');
          fs.mkdirSync('dist/assets', { recursive: true });
          fs.writeFileSync('dist/assets/gamezcoin-rewards-artwork.webp', bytes);
          console.log('Gamezcoin artwork:', bytes.length, 'bytes');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
